---
- name: Create the APT keyring directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download the Docker signing key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Determine the Debian architecture
  ansible.builtin.command: dpkg --print-architecture
  register: deb_arch
  changed_when: false
  check_mode: false

- name: Configure the Docker repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch={{ deb_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    mode: '0644'
  register: docker_repository

- name: Install Docker Engine and Compose
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if docker_repository.changed else 3600 }}"
  when: not ansible_check_mode or not docker_repository.changed

- name: Enable and start Docker
  become: true
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Allow the login user to run Docker
  become: true
  ansible.builtin.user:
    name: "{{ login_user }}"
    groups: docker
    append: true
  when: not ansible_check_mode
