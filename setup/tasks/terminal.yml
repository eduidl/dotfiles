---
- name: Inspect terminal emulator alternatives
  ansible.builtin.command: update-alternatives --query x-terminal-emulator
  register: terminal_alternatives
  changed_when: false
  failed_when: terminal_alternatives.rc not in [0, 2]
  check_mode: false

- name: Register the Alacritty mise shim as a terminal emulator
  become: true
  ansible.builtin.command:
    argv:
      - update-alternatives
      - --install
      - /usr/bin/x-terminal-emulator
      - x-terminal-emulator
      - "{{ user_home }}/.local/share/mise/shims/alacritty"
      - '50'
  when:
    - not ansible_check_mode
    - "('Alternative: ' ~ user_home ~ '/.local/share/mise/shims/alacritty') not in terminal_alternatives.stdout"
  changed_when: true

- name: Read GNOME default terminal settings
  ansible.builtin.command:
    argv: [gsettings, get, org.gnome.desktop.default-applications.terminal, "{{ item.key }}"]
  loop:
    - key: exec
      value: "'{{ user_home }}/.local/share/mise/shims/alacritty'"
    - key: exec-arg
      value: "'-e'"
  loop_control:
    label: "{{ item.key }}"
  register: gnome_terminal_settings
  changed_when: false
  check_mode: false

- name: Use Alacritty as the GNOME default terminal for Ctrl+Alt+T
  ansible.builtin.command:
    argv: [gsettings, set, org.gnome.desktop.default-applications.terminal, "{{ item.item.key }}", "{{ item.item.value }}"]
  loop: "{{ gnome_terminal_settings.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - not ansible_check_mode
    - item.stdout != item.item.value
  changed_when: true
